name: Scrape UAE Jobs

on:
  schedule:
    # Every 6 hours at :20 past the hour (00:20, 06:20, 12:20, 18:20 UTC)
    - cron: '20 */6 * * *'
  workflow_dispatch: # Manual trigger from GitHub UI
  repository_dispatch:
    types: [scrape_jobs]

# Prevent overlapping runs
concurrency:
  group: scrape-jobs
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scrapers/requirements.txt

      - name: Install dependencies
        run: pip install -r scrapers/requirements.txt

      - name: Run scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        working-directory: scrapers
        run: python run_all.py

      - name: Report status
        if: always()
        run: echo "Scrape completed at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
